name: Clean checkout checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Enable repository conventions
        run: ./tools/SetupGit.ps1
      - name: Check commit titles and source boundaries
        run: |
          python tests/git-conventions.py
          python tests/starter-templates.py
          python tests/native-audio.py
          python tests/song-mix.py
          python tests/lifecycle.py
          python tests/json-storage.py
          python tests/video-studio.py
          python tests/video-edit.py
          python tests/video-enable.py
          python tests/video-preview.py
          python tests/video-transitions.py
          python tests/video-storage.py
          python tests/video-downloads.py
          python tests/video-captions.py
          python tests/video-lanes.py
          node tests/video-history.cjs
          python tests/video-workflow.py
          python tests/video-links.py
          python tests/production.py
          python tests/asset-storage.py
          python tests/windows-names.py
          python tests/separation-workspaces.py
          python tools/release_check.py --for-public-release --ref HEAD
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install chromium
      - name: Test relocated empty installation
        run: python tests/portable-smoke.py --browser
      - name: Test Windows installer and launcher
        if: matrix.python == '3.13'
        run: python tests/windows-launcher.py
