name: Windows desktop portable build
on:
  workflow_dispatch:
jobs:
  desktop:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check public source boundary
        run: python tools/release_check.py --for-public-release --ref HEAD
      - name: Build portable desktop app
        run: ./tools/BuildDesktop.ps1
      - name: Test frozen backend isolation
        run: python tests/desktop-smoke.py --backend-only
      - uses: actions/upload-artifact@v6
        with:
          name: CoverWorkbench-Windows-x64
          path: |
            dist/desktop/CoverWorkbench-Windows-x64.zip
            dist/desktop/SHA256SUMS.txt
