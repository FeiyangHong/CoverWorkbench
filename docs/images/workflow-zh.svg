<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1110" viewBox="0 0 960 1110" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">从素材，到作品。</title>
<desc id="desc">准备干净的人声 → 校对、调声，保存 SVP → 搭好 Studio One 工程 → 试听、混音，渲染音频 → 检查音频，整理交付</desc>
<rect width="960" height="1110" rx="28" fill="#f6f5fa"/>
<g font-family="Segoe UI, Microsoft YaHei, PingFang SC, Arial, sans-serif">
<text x="40" y="46" font-size="12" fill="#8b7aa9" font-weight="600" letter-spacing="2">THE COVER WORKFLOW</text>
<text x="40" y="91" font-size="34" fill="#30283f" font-weight="700">从素材，到作品。</text>
<text x="40" y="125" font-size="19" fill="#625e73" font-weight="400">在熟悉的软件里创作，让工作台接手重复步骤。</text>
<rect x="40" y="161" width="880" height="146" rx="18" fill="#eae6f0" opacity=".5"/>
<rect x="40" y="158" width="880" height="146" rx="18" fill="white" stroke="#e6e1ee"/>
<rect x="64" y="182" width="44" height="44" rx="14" fill="#eef0f5"/>
<text x="73" y="211" font-size="21" fill="#647087" font-weight="700">01</text>
<text x="130" y="188" font-size="12" fill="#647087" font-weight="700" letter-spacing="1.3">EXTERNAL TOOLS</text>
<text x="130" y="222" font-size="26" fill="#332c43" font-weight="650">准备干净的人声</text>
<text x="130" y="256" font-size="18" fill="#625e73" font-weight="400">使用自己的分离工具，</text>
<text x="130" y="282" font-size="18" fill="#625e73" font-weight="400">得到主声、和声与伴奏。</text>
<rect x="618" y="172" width="288" height="118" rx="12" fill="#f5f6f9"/>
<text x="636" y="202" font-size="17" fill="#647087" font-weight="600">素材准备</text>
<text x="636" y="234" font-size="18" fill="#625e73" font-weight="400">确认歌曲版本</text>
<text x="636" y="260" font-size="18" fill="#625e73" font-weight="400">优先使用干净的主声</text>
<path d="M86 309v14m-4-4 4 4 4-4" stroke="#b8adc9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="335" width="880" height="146" rx="18" fill="#eae6f0" opacity=".5"/>
<rect x="40" y="332" width="880" height="146" rx="18" fill="white" stroke="#e6e1ee"/>
<rect x="64" y="356" width="44" height="44" rx="14" fill="#eee8ff"/>
<text x="73" y="385" font-size="21" fill="#7556cc" font-weight="700">02</text>
<text x="130" y="362" font-size="12" fill="#7556cc" font-weight="700" letter-spacing="1.3">SYNTHESIZER V</text>
<text x="130" y="396" font-size="26" fill="#332c43" font-weight="650">校对、调声，保存 SVP</text>
<text x="130" y="430" font-size="18" fill="#625e73" font-weight="400">提取音符，修正歌词与音准，</text>
<text x="130" y="456" font-size="18" fill="#625e73" font-weight="400">完成声库选择和演唱表情。</text>
<rect x="618" y="346" width="288" height="118" rx="12" fill="#f7f4ff"/>
<text x="636" y="376" font-size="17" fill="#7556cc" font-weight="600">工作台在旁辅助</text>
<text x="636" y="408" font-size="18" fill="#625e73" font-weight="400">歌词与读音准备</text>
<text x="636" y="434" font-size="18" fill="#625e73" font-weight="400">整段填词 · 乐句复用</text>
<path d="M86 483v14m-4-4 4 4 4-4" stroke="#b8adc9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="509" width="880" height="146" rx="18" fill="#eae6f0" opacity=".5"/>
<rect x="40" y="506" width="880" height="146" rx="18" fill="white" stroke="#e6e1ee"/>
<rect x="64" y="530" width="44" height="44" rx="14" fill="#e0f3eb"/>
<text x="73" y="559" font-size="21" fill="#317a61" font-weight="700">03</text>
<text x="130" y="536" font-size="12" fill="#317a61" font-weight="700" letter-spacing="1.3">COVERWORKBENCH</text>
<text x="130" y="570" font-size="26" fill="#332c43" font-weight="650">搭好 Studio One 工程</text>
<text x="130" y="604" font-size="18" fill="#625e73" font-weight="400">读取已保存的 SVP，分配声部，</text>
<text x="130" y="630" font-size="18" fill="#625e73" font-weight="400">按自己的模板生成独立 Song。</text>
<rect x="618" y="520" width="288" height="118" rx="12" fill="#eff9f4"/>
<text x="636" y="550" font-size="17" fill="#317a61" font-weight="600">你的本机混音模板</text>
<text x="636" y="582" font-size="18" fill="#625e73" font-weight="400">沿用效果器与路由</text>
<text x="636" y="608" font-size="18" fill="#625e73" font-weight="400">多条主声 / 可无和声</text>
<path d="M86 657v14m-4-4 4 4 4-4" stroke="#b8adc9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="683" width="880" height="146" rx="18" fill="#eae6f0" opacity=".5"/>
<rect x="40" y="680" width="880" height="146" rx="18" fill="white" stroke="#e6e1ee"/>
<rect x="64" y="704" width="44" height="44" rx="14" fill="#eee8ff"/>
<text x="73" y="733" font-size="21" fill="#7556cc" font-weight="700">04</text>
<text x="130" y="710" font-size="12" fill="#7556cc" font-weight="700" letter-spacing="1.3">STUDIO ONE</text>
<text x="130" y="744" font-size="26" fill="#332c43" font-weight="650">试听、混音，渲染音频</text>
<text x="130" y="778" font-size="18" fill="#625e73" font-weight="400">调整人声与伴奏的平衡，</text>
<text x="130" y="804" font-size="18" fill="#625e73" font-weight="400">确认效果器，再导出混音。</text>
<rect x="618" y="694" width="288" height="118" rx="12" fill="#f7f4ff"/>
<text x="636" y="724" font-size="17" fill="#7556cc" font-weight="600">保留创作判断</text>
<text x="636" y="756" font-size="18" fill="#625e73" font-weight="400">新歌仍需试听与微调</text>
<text x="636" y="782" font-size="18" fill="#625e73" font-weight="400">软件与插件由你提供</text>
<path d="M86 831v14m-4-4 4 4 4-4" stroke="#b8adc9" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="857" width="880" height="146" rx="18" fill="#eae6f0" opacity=".5"/>
<rect x="40" y="854" width="880" height="146" rx="18" fill="white" stroke="#e6e1ee"/>
<rect x="64" y="878" width="44" height="44" rx="14" fill="#e0f3eb"/>
<text x="73" y="907" font-size="21" fill="#317a61" font-weight="700">05</text>
<text x="130" y="884" font-size="12" fill="#317a61" font-weight="700" letter-spacing="1.3">COVERWORKBENCH</text>
<text x="130" y="918" font-size="26" fill="#332c43" font-weight="650">检查音频，整理交付</text>
<text x="130" y="952" font-size="18" fill="#625e73" font-weight="400">检查响度与峰值，整理字幕，</text>
<text x="130" y="978" font-size="18" fill="#625e73" font-weight="400">打包素材或替换视频音轨。</text>
<rect x="618" y="868" width="288" height="118" rx="12" fill="#eff9f4"/>
<text x="636" y="898" font-size="17" fill="#317a61" font-weight="600">最后一步，交给耳朵</text>
<text x="636" y="930" font-size="18" fill="#625e73" font-weight="400">人工检查声音与画面</text>
<text x="636" y="956" font-size="18" fill="#625e73" font-weight="400">确认满意后自行发布</text>
<circle cx="48" cy="1040" r="5" fill="#997be3"/>
<text x="63" y="1046" font-size="15" fill="#625e73" font-weight="400">创作软件</text>
<circle cx="170" cy="1040" r="5" fill="#72b59a"/>
<text x="185" y="1046" font-size="15" fill="#625e73" font-weight="400">工作台</text>
<text x="40" y="1082" font-size="18" fill="#766289" font-weight="600">已有调好的 SVP？从第 03 步开始。</text>
<text x="778" y="1082" font-size="14" fill="#9b90aa" font-weight="600">CoverWorkbench</text>
</g></svg>
